name: Release binaries

# Push a version tag (`git tag v0.4.0 && git push --tags`) to cross-compile the standalone
# tok binary for every platform and attach it to the GitHub Release. Go cross-compiles all
# targets from a single Linux runner - no native arm or Intel-mac runners required - and the
# output names match what scripts/install.sh and scripts/install.ps1 download.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: tok-linux-x64
          - goos: linux
            goarch: arm64
            out: tok-linux-arm64
          - goos: darwin
            goarch: amd64
            out: tok-macos-x64
          - goos: darwin
            goarch: arm64
            out: tok-macos-arm64
          - goos: windows
            goarch: amd64
            out: tok-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o "build/${{ matrix.out }}" ./cmd/tok
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ matrix.out }}
